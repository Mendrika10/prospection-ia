name: ci

# Déclenché sur chaque PR et sur main (protection de branche : merge impossible si rouge).
on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  # Job « sql » : le schéma et la sécurité sont la source de vérité.
  # Il tourne dès maintenant — c'est la seule preuve de fonctionnement réelle
  # du dépôt tant que le front n'existe pas (sprint S5).
  # ---------------------------------------------------------------------------
  sql:
    # Nom volontairement court et sans caractère spécial : il sert de « context »
    # dans la protection de branche (required status checks).
    name: sql
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: prospection
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: prospection

    steps:
      - uses: actions/checkout@v4

      # Postgres nu n'a pas les rôles de Supabase : on les crée d'abord.
      - name: Rôles Supabase (anon / authenticated / service_role)
        run: psql -v ON_ERROR_STOP=1 -q -f .github/sql/roles.sql

      # Le script est réutilisé tel quel pour la réapplication (étape suivante) :
      # une seule boucle à maintenir, pas deux copies qui divergeraient.
      - name: Appliquer les migrations sur une base neuve
        run: bash .github/sql/apply-migrations.sh

      - name: Seed de développement
        run: psql -v ON_ERROR_STOP=1 -q -f supabase/seed.sql

      # Tous les tests SQL de supabase/tests/*.sql, dans l'ordre alphabétique.
      # Sort en code ≠ 0 si un test échoue : c'est le garde-fou principal.
      - name: Tests SQL
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(supabase/tests/*.sql)
          if [ ${#files[@]} -eq 0 ]; then
            echo "::error::Aucun test trouvé dans supabase/tests/"
            exit 1
          fi
          for f in "${files[@]}"; do
            echo "→ $f"
            psql -v ON_ERROR_STOP=1 -f "$f"
          done

      # -------------------------------------------------------------------------
      # Réapplication des migrations sur la base DÉJÀ PEUPLÉE.
      # C'est le scénario réel d'un projet Supabase en service : la migration arrive
      # alors que les tables contiennent déjà des données.
      #
      # Cette étape vient APRÈS les tests SQL, pour deux raisons :
      #   * les tests comptent des lignes exactes (`1 lead`) et insèrent des SIREN fixes :
      #     peupler la base avant eux les rendrait faux, ou obligerait à affaiblir leurs
      #     assertions — ce qu'on refuse ;
      #   * la comparaison d'empreinte a besoin d'un maximum de données en place.
      #
      # On ne se contente pas de l'exit code : un `truncate` réussit (code 0) et détruit les
      # données. La comparaison d'une empreinte AVANT/APRÈS — nombre de lignes ET contenu —
      # est la seule preuve. Un `update` destructeur ne change pas le nombre de lignes, mais
      # change l'empreinte.
      # -------------------------------------------------------------------------
      # Avant de comparer, il faut qu'il y ait quelque chose à perdre dans CHAQUE table :
      # après le seed seul, quatre des six tables sont vides (`companies`, `analyses`,
      # `leads`, `blocklist`) et une migration qui viderait `companies` ne changerait
      # l'empreinte de RIEN. D'où une ligne témoin par table, insérée juste avant la mesure.
      - name: Données témoins (une ligne par table, avant réapplication)
        run: psql -v ON_ERROR_STOP=1 -q -f .github/sql/witness-data.sql

      - name: Réappliquer les migrations sur une base peuplée (idempotence)
        run: |
          set -euo pipefail
          psql -v ON_ERROR_STOP=1 -q -tA -f .github/sql/db-fingerprint.sql > /tmp/empreinte-avant.txt
          # Affichée volontairement : elle prouve DANS LE LOG ce qui a été mesuré, et que chaque
          # table était peuplée au moment de la mesure (une table vide ne prouve rien).
          echo "Empreinte AVANT (table|nb lignes|md5 du contenu) :"
          cat /tmp/empreinte-avant.txt
          bash .github/sql/apply-migrations.sh
          psql -v ON_ERROR_STOP=1 -q -tA -f .github/sql/db-fingerprint.sql > /tmp/empreinte-apres.txt
          if ! diff -u /tmp/empreinte-avant.txt /tmp/empreinte-apres.txt; then
            echo "::error::Réapplication des migrations : des données ont changé (voir le diff ci-dessus). Une migration doit être réapplicable sans perte ni duplication — AGENTS.md §4."
            exit 1
          fi
          echo "OK — migrations réappliquées sans modifier une seule ligne"

  # ---------------------------------------------------------------------------
  # Job « secrets » : applique le point « aucun secret dans le code » de la DoD.
  # ---------------------------------------------------------------------------
  secrets:
    name: secrets
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Scan des secrets évidents
        run: |
          set -euo pipefail
          # Cible : JWT (clés Supabase, tokens) et clés privées PEM.
          # .env.example est exclu : il ne contient que des valeurs factices.
          pattern='eyJ[A-Za-z0-9_-]{10,}|-----BEGIN [A-Z ]*PRIVATE KEY-----'
          if matches=$(grep -rnE "$pattern" . --exclude-dir=.git --exclude=.env.example); then
            echo "::error::Secret détecté dans le dépôt :"
            echo "$matches"
            exit 1
          fi
          echo "OK — aucun secret détecté"

  # ---------------------------------------------------------------------------
  # Job « node » : lint, types, tests du dashboard Next.js (sprint S5).
  # Aucun code Node n'existe avant S5 : le job le signale explicitement au lieu
  # de prétendre vérifier quelque chose. Sa suppression est suivie dans docs/sprint-01.md §7.
  # ---------------------------------------------------------------------------
  node:
    name: node
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Projet Node présent ?
        id: probe
        run: |
          if [ -f package.json ] && [ -f pnpm-lock.yaml ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Job node ignoré::Pas de package.json/pnpm-lock.yaml — lint/typecheck/test arriveront avec apps/dashboard (sprint S5). Ce garde-fou est alors à supprimer (docs/sprint-01.md §7)."
          fi

      # pnpm/action-setup@v4 lit « packageManager » dans package.json.
      - uses: pnpm/action-setup@v4
        if: steps.probe.outputs.ready == 'true'

      - uses: actions/setup-node@v4
        if: steps.probe.outputs.ready == 'true'
        with:
          node-version: 24
          cache: pnpm

      - name: Installer
        if: steps.probe.outputs.ready == 'true'
        run: pnpm install --frozen-lockfile

      - name: Lint
        if: steps.probe.outputs.ready == 'true'
        run: pnpm lint

      - name: Types
        if: steps.probe.outputs.ready == 'true'
        run: pnpm typecheck

      - name: Tests
        if: steps.probe.outputs.ready == 'true'
        run: pnpm test
